<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 400" width="1320" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bar-clara { fill: #4DB8FA; }
      .bar-azul  { fill: #0096F5; }
      .bar-blanca{ fill: #FFFFFF; }
      .txt-auto    { font-family: 'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif; font-weight: 700; fill: #071A3D; }
      .txt-metrica { font-family: 'Montserrat', 'Poppins', 'Segoe UI', Arial, sans-serif; font-weight: 700; fill: #0096F5; }
    </style>
  </defs>

  <!-- Ícono -->
  <g>
    <rect x="20" y="20" width="360" height="360" rx="80" ry="80" fill="#071A3D"/>
    <rect class="bar-clara" x="98"  y="230" width="40" height="64"  rx="10"/>
    <rect class="bar-azul"  x="162" y="186" width="40" height="108" rx="10"/>
    <rect class="bar-azul"  x="226" y="142" width="40" height="152" rx="10"/>
    <rect class="bar-blanca" x="290" y="98"  width="40" height="196" rx="10"/>
    <polyline points="118,214 182,170 246,126 310,82"
              fill="none" stroke="#FFFFFF" stroke-width="5"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="118" cy="214" r="4.5" fill="#FFFFFF"/>
    <circle cx="182" cy="170" r="4.5" fill="#FFFFFF"/>
    <circle cx="246" cy="126" r="4.5" fill="#FFFFFF"/>
    <circle cx="310" cy="82"  r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="432" y="252" font-size="130">
    <tspan class="txt-auto">Auto</tspan><tspan class="txt-metrica">Métrica</tspan>
  </text>
</svg>
