<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bar-clara { fill: #4DB8FA; }
      .bar-azul  { fill: #0096F5; }
      .bar-blanca{ fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Fondo -->
  <rect x="0" y="0" width="400" height="400" rx="88" ry="88" fill="#071A3D"/>

  <!-- Barras estadísticas ascendentes (gestión y control de datos) -->
  <rect class="bar-clara" x="88"  y="230" width="44" height="70"  rx="12"/>
  <rect class="bar-azul"  x="158" y="182" width="44" height="118" rx="12"/>
  <rect class="bar-azul"  x="228" y="134" width="44" height="166" rx="12"/>
  <rect class="bar-blanca" x="298" y="86"  width="44" height="214" rx="12"/>

  <!-- Línea de tendencia (métrica / crecimiento) -->
  <polyline points="110,212 180,164 250,116 320,68"
            fill="none" stroke="#FFFFFF" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="110" cy="212" r="5" fill="#FFFFFF"/>
  <circle cx="180" cy="164" r="5" fill="#FFFFFF"/>
  <circle cx="250" cy="116" r="5" fill="#FFFFFF"/>
  <circle cx="320" cy="68"  r="5" fill="#FFFFFF"/>
</svg>
